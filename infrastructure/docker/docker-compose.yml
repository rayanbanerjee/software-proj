services:
  postgres:
    image: postgres:16-alpine
    container_name: collab-editor-postgres
    environment:
      POSTGRES_DB: collab_editor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d collab_editor"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: collab-editor-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    container_name: collab-editor-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.dev
    container_name: collab-editor-api
    command: ["pnpm", "--filter", "@repo/api", "dev"]
    env_file:
      - ../../apps/api/.env.local
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/collab_editor
      REDIS_URL: redis://redis:6379
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      COLLAB_URL: ${COLLAB_URL:-ws://localhost:4001}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-qwen/qwen3.6-plus:free}
      OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-software-proj}
      OPENROUTER_APP_URL: ${OPENROUTER_APP_URL:-http://localhost:3000}
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_BUCKET: collab-editor
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  collab:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.dev
    container_name: collab-editor-collab
    command: ["pnpm", "--filter", "@repo/collab", "dev"]
    env_file:
      - ../../apps/api/.env.local
    environment:
      NODE_ENV: development
      PORT: 4001
      HOST: 0.0.0.0
    ports:
      - "4001:4001"
    depends_on:
      api:
        condition: service_started

  worker:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.dev
    container_name: collab-editor-worker
    command: ["pnpm", "--filter", "@repo/worker", "dev"]
    environment:
      NODE_ENV: development
      PORT: 4002
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/collab_editor
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_BUCKET: collab-editor
      LLM_API_KEY: replace-me
    ports:
      - "4002:4002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  minio-data:
